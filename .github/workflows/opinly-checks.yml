name: Opinly integration checks
on:
  push:
    branches: [opinly-blog-integration]
  pull_request:
    paths:
      - 'backend/routers/opinly_routes.py'
      - 'backend/tests/test_opinly_routes.py'
      - 'frontend/src/pages/OpinlyBlog.jsx'
      - 'frontend/src/App.js'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.110.1 'httpx<0.28' pytest svix
      - run: python -m py_compile backend/routers/opinly_routes.py backend/tests/test_opinly_routes.py
      - run: PYTHONPATH=backend pytest -q backend/tests/test_opinly_routes.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
        working-directory: frontend
      - run: CI=false npm run build
        working-directory: frontend
